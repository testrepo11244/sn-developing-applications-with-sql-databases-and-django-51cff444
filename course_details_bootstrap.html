{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="card-title text-primary mb-4">{{ course.title }}</h1>
                    <p class="card-text lead">{{ course.description }}</p>
                    <hr>
                    <h3 class="mb-3">Course Lessons</h3>
                    <div class="list-group">
                        {% for lesson in course.lessons.all %}
                            <a href="{% url 'lesson_detail' lesson.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                <span>{{ lesson.title }}</span>
                                <span class="badge bg-secondary rounded-pill">Lesson {{ forloop.counter }}</span>
                            </a>
                        {% empty %}
                            <p class="text-muted">No lessons available for this course yet.</p>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
